name: admin-ui development

on:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: admin-ui-development
  cancel-in-progress: false

jobs:
  unit:
    uses: sellgar/sellgar.infrastructure/.github/workflows/test-application.yml@delivery-v0.7.0
    secrets:
      SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
    with:
      source-revision: ${{ github.sha }}

  images:
    needs: unit
    uses: sellgar/sellgar.infrastructure/.github/workflows/build-service.yml@delivery-v0.7.0
    permissions:
      contents: write
      packages: write
    secrets:
      SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
    with:
      release-name: admin-ui
      migrations: false
      publish: true

  delivery:
    needs: images
    uses: sellgar/sellgar.infrastructure/.github/workflows/deploy-application.yml@delivery-v0.7.0
    with:
      environment: dev
      namespace: sellgar-dev
      release-name: admin-ui
      source-revision: ${{ github.sha }}
      chart-revision: ${{ needs.images.outputs.chart-revision }}
      image-digest: ${{ needs.images.outputs.image-digest }}
